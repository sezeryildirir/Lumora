<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Thank You | Lumora Property Services</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{--navy:#151A23;--teal:#2BA8A0;--cream:#F2F0EB;--ink:#202733;--muted:#66707d}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:28px}
    .card{max-width:650px;background:#fff;border-radius:18px;padding:52px 36px;text-align:center;box-shadow:0 18px 44px rgba(21,26,35,.1)}
    .check{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:var(--teal);color:#fff;font-size:36px}
    h1{margin:0 0 14px;color:var(--navy);font-size:38px}p{color:var(--muted);font-size:18px;line-height:1.6;margin:0 0 28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="thanks-title">
      <div class="check" aria-hidden="true">✓</div>
      <h1 id="thanks-title">Thank You!</h1>
      <p>Your quote request has been received. The Lumora team will contact you within one business hour.</p>
      <a class="btn" href="/">Return to Homepage</a>
    </section>
  </main>
</body>
</html>
